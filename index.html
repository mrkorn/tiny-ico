<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiny ICO Generator</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101522;color:#e9eef9;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(100%,540px)}h1{margin:0 0 5px;font-size:25px}p{color:#aebad0;margin:0 0 20px}.drop{border:2px dashed #506184;border-radius:18px;padding:26px;text-align:center;background:#1b2436;cursor:pointer}.drop.over{border-color:#65b5ff;background:#233c58}.drop strong{display:block;font-size:18px}.drop small{display:block;margin:8px;color:#aebad0}input[type=file]{display:none}.btn{border:0;border-radius:10px;padding:12px 18px;background:#3a8bfa;color:white;font:inherit;font-weight:650;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.preview{display:grid;place-items:center;min-height:210px;margin:16px 0;border-radius:15px;background-color:#eee;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.preview img{max-width:190px;max-height:190px;object-fit:contain}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}.row input{background:#1b2436;color:white;border:1px solid #506184;border-radius:9px;padding:10px;min-width:0;flex:1}.sizes{font-size:13px;color:#aebad0}.status{font-size:13px;color:#8fe0af;min-height:20px}footer{font-size:12px;color:#8b97ac;text-align:center;margin-top:18px}
</style>
</head>
<!-- Trigger GitHub Pages deployment -->
<body><main>
<h1>🧩 Tiny ICO Generator</h1><p>Paste, drop, or select PNG / WebP → multi-size favicon.ico</p>
<div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose or paste image"><strong>📋 Ctrl+V to paste an image</strong><small>Or drag & drop / click to choose PNG or WebP</small><button class="btn" type="button" id="choose">Choose Image</button><input id="file" type="file" accept="image/png,image/webp"></div>
<div class="preview" id="preview"><span style="color:#667">Image preview</span></div>
<div class="row"><label for="name">File name</label><input id="name" value="favicon" spellcheck="false"><span>.ico</span></div>
<div class="row"><button class="btn" id="download" disabled>Download .ico</button><span class="sizes">16 · 24 · 32 · 48 · 64 · 128 · 256 px</span></div>
<div class="status" id="status" aria-live="polite"></div><footer>Local-only · No upload · Transparency preserved</footer>
</main>
<script>
const $=s=>document.querySelector(s), sizes=[16,24,32,48,64,128,256];
let bitmap=null,previewUrl=null;
const status=t=>$('#status').textContent=t;
async function load(file){
 if(!file || !['image/png','image/webp'].includes(file.type)){status('Please select a PNG or WebP image.');return;}
 try{
  const next=await createImageBitmap(file);
  if(bitmap)bitmap.close();bitmap=next;
  if(previewUrl)URL.revokeObjectURL(previewUrl);
  previewUrl=URL.createObjectURL(file);
  const img=document.createElement('img');img.src=previewUrl;img.alt='Source image';
  $('#preview').replaceChildren(img);
  $('#download').disabled=false;
  status(`Ready: ${bitmap.width} × ${bitmap.height} px`);
 }catch(e){status('Could not open image: '+e.message)}
}
$('#choose').onclick=e=>{e.stopPropagation();$('#file').click()};
$('#drop').onclick=()=>$('#file').click();
$('#drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#file').click()}};
$('#file').onchange=e=>load(e.target.files[0]);
$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('over')};
$('#drop').ondragleave=()=>$('#drop').classList.remove('over');
$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('over');load([...e.dataTransfer.files].find(f=>['image/png','image/webp'].includes(f.type)))};
document.addEventListener('paste',e=>{
 const f=[...e.clipboardData.items].find(i=>i.type==='image/png'||i.type==='image/webp');
 if(f){e.preventDefault();load(f.getAsFile())}
});
async function pngBytes(size){
 const c=document.createElement('canvas');c.width=c.height=size;
 const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 const scale=Math.min(size/bitmap.width,size/bitmap.height);
 const w=bitmap.width*scale,h=bitmap.height*scale;
 ctx.drawImage(bitmap,(size-w)/2,(size-h)/2,w,h);
 const blob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('PNG encoding failed')),'image/png'));
 return new Uint8Array(await blob.arrayBuffer());
}
async function makeIco(){
 const chunks=await Promise.all(sizes.map(pngBytes));
 const headerLength=6+16*sizes.length;
 const total=headerLength+chunks.reduce((n,b)=>n+b.length,0);
 const bytes=new Uint8Array(total),view=new DataView(bytes.buffer);
 view.setUint16(0,0,true);view.setUint16(2,1,true);view.setUint16(4,sizes.length,true);
 let offset=headerLength;
 chunks.forEach((chunk,i)=>{
  const pos=6+i*16,s=sizes[i];bytes[pos]=s===256?0:s;bytes[pos+1]=s===256?0:s;
  bytes[pos+2]=0;bytes[pos+3]=0;view.setUint16(pos+4,1,true);view.setUint16(pos+6,32,true);
  view.setUint32(pos+8,chunk.length,true);view.setUint32(pos+12,offset,true);
  bytes.set(chunk,offset);offset+=chunk.length;
 });
 return new Blob([bytes],{type:'image/x-icon'});
}
$('#download').onclick=async()=>{
 if(!bitmap)return;
 const btn=$('#download');btn.disabled=true;status('Generating ICO…');
 try{
  const blob=await makeIco(),url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=($('#name').value.trim().replace(/\.ico$/i,'').replace(/[\\/:*?"<>|]/g,'_')||'favicon')+'.ico';
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  status('ICO downloaded · 7 sizes · transparency preserved');
 }catch(e){status('Error: '+e.message)}finally{btn.disabled=false}
};
</script></body></html>
